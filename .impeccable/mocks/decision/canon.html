<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#1F1F1F;font-family:Roboto,sans-serif;position:relative}
.status{height:28px;display:flex;justify-content:space-between;padding:6px 20px;font:500 12px Roboto}
.bar{height:64px;display:flex;align-items:center;padding:0 16px;gap:16px}
.bar h1{font:400 22px Roboto;flex:1}
.ic{width:24px;height:24px;border-radius:50%;background:#e3e3e3}
.search{margin:4px 16px 12px;height:52px;border-radius:26px;background:#F0F4F9;display:flex;align-items:center;padding:0 20px;color:#5f6368;font-size:15px}
.sec{padding:8px 16px;font:500 14px Roboto;color:#444}
.row{display:flex;gap:14px;padding:10px 16px;align-items:center}
.th{width:52px;height:68px;border:1px solid #dadce0;border-radius:6px;background:#fff;position:relative}
.th::after{content:"";position:absolute;left:8px;right:8px;top:12px;height:30px;background:repeating-linear-gradient(#dadce0 0 2px,transparent 2px 7px)}
.row b{display:block;font:500 16px Roboto}
.row small{display:block;font:400 13px Roboto;color:#5f6368;margin-top:4px}
.row .m{margin-left:auto;width:4px;height:16px;background:radial-gradient(#5f6368 1.5px,transparent 2px) 0 0/4px 6px}
.fab{position:absolute;right:16px;bottom:76px;width:96px;height:56px;border-radius:16px;background:#1A73E8;color:#fff;display:flex;align-items:center;justify-content:center;font:500 15px Roboto;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ad{position:absolute;left:0;right:0;bottom:0;height:56px;background:#f1f3f4;display:flex;align-items:center;justify-content:center;font-size:11px;color:#80868b}
</style></head><body>
<div class="status"><span>9:41</span><span>72%</span></div>
<div class="bar"><h1>Docfold</h1><span class="ic"></span></div>
<div class="search">Search your scans</div>
<div class="sec">Recent</div>
<div class="row"><div class="th"></div><div><b>Aadhaar card — both sides</b><small>2 pages · Today, 4:42 PM</small></div><span class="m"></span></div>
<div class="row"><div class="th"></div><div><b>Semester fee receipt</b><small>1 page · Today, 11:08 AM</small></div><span class="m"></span></div>
<div class="row"><div class="th"></div><div><b>Rental agreement 2026</b><small>11 pages · Nov 1</small></div><span class="m"></span></div>
<div class="row"><div class="th"></div><div><b>Physics notes — Ch. 7 Optics</b><small>18 pages · Oct 28</small></div><span class="m"></span></div>
<div class="row"><div class="th"></div><div><b>Bank KYC form</b><small>4 pages · Oct 21</small></div><span class="m"></span></div>
<div class="fab">📷 Scan</div>
<div class="ad">Ad · adaptive banner</div>
</body></html>
